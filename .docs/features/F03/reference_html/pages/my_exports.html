<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财经文档系统 - 我的导出</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1173d4",
                        "background-light": "#f6f7f8",
                        "border-color": "#dbe0e6",
                        "text-main": "#111418",
                        "text-secondary": "#617589"
                    },
                    fontFamily: {
                        "display": ["Microsoft YaHei", "微软雅黑", "Inter", "Noto Sans SC", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            vertical-align: middle;
            font-size: 20px;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-text-main">
    <!-- Header -->
    <header class="bg-white border-b border-border-color h-16 flex items-center px-8 shrink-0 shadow-sm">
        <div class="flex items-center justify-between w-full max-w-[1440px] mx-auto">
            <a href="../index.html" class="flex items-center gap-4 hover:opacity-80 transition-opacity">
                <span class="material-symbols-outlined text-3xl">arrow_back</span>
                <span class="text-lg font-bold">返回首页</span>
            </a>
            <h1 class="text-2xl font-bold">财经文档系统</h1>
            <div class="relative">
                <input type="text" placeholder="搜索文档..." class="w-64 h-10 pl-10 pr-4 rounded-lg border border-border-color text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 p-8 max-w-[1440px] mx-auto w-full">
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-sm text-text-secondary mb-6">
            <a href="../index.html" class="hover:text-primary transition-colors">首页</a>
            <span class="mx-1 text-gray-300">/</span>
            <a href="#" class="hover:text-primary transition-colors">导入导出</a>
            <span class="mx-1 text-gray-300">/</span>
            <span class="text-text-main font-medium">我的导出</span>
        </nav>

        <h2 class="text-2xl font-bold mb-6">我的导出</h2>

        <!-- Export List -->
        <section class="bg-white rounded-lg border border-border-color overflow-hidden shadow-sm flex-1">
            <div class="overflow-x-auto custom-scrollbar flex-1">
                <table class="w-full text-sm text-left border-collapse min-w-[1000px]">
                    <thead>
                        <tr class="bg-gray-50 border-b border-border-color sticky top-0 z-10">
                            <th class="px-4 py-3 font-semibold text-text-secondary">导出任务ID</th>
                            <th class="px-4 py-3 font-semibold text-text-secondary">导出时间</th>
                            <th class="px-4 py-3 font-semibold text-text-secondary">导出内容</th>
                            <th class="px-4 py-3 font-semibold text-text-secondary">状态</th>
                            <th class="px-4 py-3 font-semibold text-text-secondary">文件大小</th>
                            <th class="px-4 py-3 font-semibold text-text-secondary text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-border-color">
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3.5 text-text-main font-medium">EXP-20260326-001</td>
                            <td class="px-4 py-3.5 text-text-secondary">2026-03-26 10:30:00</td>
                            <td class="px-4 py-3.5">会计凭证 (3条)</td>
                            <td class="px-4 py-3.5">
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-600 border border-green-100">已完成</span>
                            </td>
                            <td class="px-4 py-3.5 text-text-secondary">2.4 MB</td>
                            <td class="px-4 py-3.5 text-right">
                                <div class="flex justify-end gap-2">
                                    <a href="#" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-primary hover:bg-slate-100 rounded-lg transition-all" title="下载">
                                        <span class="material-symbols-outlined text-lg">download</span>
                                    </a>
                                    <button class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-slate-100 rounded-lg transition-all" title="删除">
                                        <span class="material-symbols-outlined text-lg">delete</span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3.5 text-text-main font-medium">EXP-20260325-002</td>
                            <td class="px-4 py-3.5 text-text-secondary">2026-03-25 16:45:00</td>
                            <td class="px-4 py-3.5">销资汇总表 (5条)</td>
                            <td class="px-4 py-3.5">
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-600 border border-green-100">已完成</span>
                            </td>
                            <td class="px-4 py-3.5 text-text-secondary">1.8 MB</td>
                            <td class="px-4 py-3.5 text-right">
                                <div class="flex justify-end gap-2">
                                    <a href="#" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-primary hover:bg-slate-100 rounded-lg transition-all" title="下载">
                                        <span class="material-symbols-outlined text-lg">download</span>
                                    </a>
                                    <button class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-slate-100 rounded-lg transition-all" title="删除">
                                        <span class="material-symbols-outlined text-lg">delete</span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3.5 text-text-main font-medium">EXP-20260324-001</td>
                            <td class="px-4 py-3.5 text-text-secondary">2026-03-24 09:15:00</td>
                            <td class="px-4 py-3.5">税务申报资料 (2条)</td>
                            <td class="px-4 py-3.5">
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-50 text-yellow-600 border border-yellow-100">处理中</span>
                            </td>
                            <td class="px-4 py-3.5 text-text-secondary">-</td>
                            <td class="px-4 py-3.5 text-right">
                                <div class="flex justify-end gap-2">
                                    <button class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-gray-600 hover:bg-slate-100 rounded-lg transition-all" title="取消" disabled>
                                        <span class="material-symbols-outlined text-lg">cancel</span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="px-6 py-4 border-t border-border-color flex items-center justify-between bg-white">
                <span class="text-sm text-text-secondary">共 3 条记录</span>
                <div class="flex items-center gap-2">
                    <button class="w-8 h-8 flex items-center justify-center rounded border border-border-color hover:bg-gray-50 disabled:opacity-50" disabled>
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    <button class="w-8 h-8 flex items-center justify-center rounded bg-primary text-white text-sm font-medium">1</button>
                    <button class="w-8 h-8 flex items-center justify-center rounded border border-border-color hover:bg-gray-50 text-sm">2</button>
                    <button class="w-8 h-8 flex items-center justify-center rounded border border-border-color hover:bg-gray-50">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                    <select class="h-8 px-2 rounded border border-border-color text-xs">
                        <option>10条/页</option>
                        <option>20条/页</option>
                        <option>50条/页</option>
                    </select>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
